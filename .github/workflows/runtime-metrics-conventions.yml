name: Runtime Metrics Conventions

on:
  push:
    branches:
      - master
      - release/**
  pull_request:
    paths:
      - lib/sentry/metrics/**
      - lib/sentry/metric.ex
      - test/sentry/metrics/runtime_conventions_test.exs
      - scripts/check_metrics_conventions.sh
      - .github/workflows/runtime-metrics-conventions.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      conventions_ref:
        description: sentry-conventions branch, tag or commit to check against
        required: false

env:
  MIX_ENV: test
  CONVENTIONS_REF: ${{ inputs.conventions_ref || 'main' }}

jobs:
  conventions:
    name: Runtime metrics match sentry-conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out this repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "27.2"

      - name: Cache Elixir dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-elixir-1.18-otp-27.2-mix-${{ hashFiles('**/mix*.lock') }}

      - name: Download Mix dependencies
        run: mix deps.get --check-locked

      - name: Check runtime metrics against sentry-conventions
        run: mix test.conventions
